<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Base Badge / Leather cover backing -->
  <rect width="64" height="64" rx="14" fill="#3D2311" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#4E3118" stroke="#8C5E3C" stroke-width="2" />
  
  <!-- Subtle inner border tooling -->
  <rect x="5" y="5" width="54" height="54" rx="9" stroke="#A8754B" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.6" />
  
  <!-- Open Book Parchment Pages Left & Right -->
  <!-- Left Page Stack -->
  <path d="M14 47C19 46 27 45.5 32 48.5V20C27 17 19 17.5 14 18.5V47Z" fill="#EAE0D3" stroke="#D1BEAA" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Left Top Page -->
  <path d="M14 45.5C19 44.5 27 44 32 47V18.5C27 15.5 19 16 14 17V45.5Z" fill="#FAF5EE" stroke="#3D2311" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Right Page Stack -->
  <path d="M50 47C45 46 37 45.5 32 48.5V20C37 17 45 17.5 50 18.5V47Z" fill="#EAE0D3" stroke="#D1BEAA" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Right Top Page -->
  <path d="M50 45.5C45 44.5 37 44 32 47V18.5C37 15.5 45 16 50 17V45.5Z" fill="#FAF5EE" stroke="#3D2311" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Book Spine Center Binding -->
  <path d="M32 18.5V47" stroke="#8C5E3C" stroke-width="2" stroke-linecap="round" />
  <path d="M32 47C27 44 19 44.5 14 45.5" stroke="#3D2311" stroke-width="1.5" stroke-linecap="round" />
  <path d="M32 47C37 44 45 44.5 50 45.5" stroke="#3D2311" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Golden Ribbon Bookmark -->
  <path d="M32 18.5V36L35 33L38 36V18.2C36 17.5 34 17.8 32 18.5Z" fill="#D4A373" stroke="#9E6F42" stroke-width="0.8" />

  <!-- Story Arc Line (Subtle Arc Over Pages) -->
  <path d="M20 27C24 23 40 23 44 27" stroke="#C49366" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 3" opacity="0.9" />
  <circle cx="44" cy="27" r="1.5" fill="#D4A373" />
</svg>
